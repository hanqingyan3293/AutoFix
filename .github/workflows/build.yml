name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 构建 Autodesk-Fix（net472）
        run: dotnet build src/Autodesk-Fix.csproj -c Release

      - name: 构建 Autodesk-Fix（net40 兼容版）
        run: dotnet build src/Autodesk-Fix.net40.csproj -c Release

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: autodesk-fix-binaries
          if-no-files-found: error
          path: |
            src/bin/Release/net472/Autodesk-Fix.exe
            src/bin/Release/net40/Autodesk-Fix.exe
